{% extends "base.html" %}

{% block title %}Sign In / Register - QuizMaster Pro{% endblock %}

{% block content %}
<div class="container" style="padding: 3rem 0; min-height: 75vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎮</div>
            <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem;">
                QuizMaster Pro
            </h1>
            <p style="color: var(--text-muted); font-size: 0.925rem;">
                Sign in to your account or create a new one
            </p>
        </div>

        <!-- Auth Tabs -->
        <div style="display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 1.75rem;">
            <button id="tab-login" class="auth-tab active" type="button" onclick="switchAuthTab('login')">
                Login
            </button>
            <button id="tab-register" class="auth-tab" type="button" onclick="switchAuthTab('register')">
                Register
            </button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" method="POST" action="{{ url_for('auth') }}">
            <input type="hidden" name="action" value="login">
            
            <div class="form-group">
                <label class="form-label" for="login-username">Username or Email</label>
                <input id="login-username" type="text" name="username" class="form-control" required placeholder="Enter username or email">
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <input id="login-password" type="password" name="password" class="form-control" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Sign In
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" method="POST" action="{{ url_for('auth') }}" style="display: none;">
            <input type="hidden" name="action" value="register">
            
            <div class="form-group">
                <label class="form-label" for="reg-username">Username</label>
                <input id="reg-username" type="text" name="username" class="form-control" required placeholder="Choose a username">
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-email">Email Address</label>
                <input id="reg-email" type="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-password">Password</label>
                <input id="reg-password" type="password" name="password" class="form-control" required placeholder="Create a password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Create Account
            </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center; color: var(--text-muted); font-size: 0.825rem;">
            Test knowledge • Earn badges • Track scores
        </div>
    </div>
</div>

<style>
.auth-tab {
    flex: 1;
    padding: 0.55rem;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-weight: 500;
    font-family: inherit;
    color: var(--text-secondary);
    background: transparent;
    cursor: pointer;
    transition: var(--transition);
}

.auth-tab.active {
    background: var(--card-bg);
    color: var(--text-main);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
}
</style>

<script>
function switchAuthTab(tab) {
    const loginForm = document.getElementById('login-form');
    const regForm = document.getElementById('register-form');
    const loginTab = document.getElementById('tab-login');
    const regTab = document.getElementById('tab-register');

    if (tab === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        loginTab.classList.add('active');
        regTab.classList.remove('active');
    } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        regTab.classList.add('active');
        loginTab.classList.remove('active');
    }
}
</script>
{% endblock %}
