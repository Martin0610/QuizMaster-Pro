{% extends "base.html" %}

{% block title %}{{ quiz.title }} - QuizMaster Pro{% endblock %}

{% block content %}
<div class="container quiz-container">
    
    <!-- Quiz Meta Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <div>
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">
                {{ quiz.category_name }} • {{ quiz.difficulty }}
            </span>
            <h1 style="font-size: 1.4rem; font-weight: 700; color: var(--text-main); margin-top: 0.15rem;">
                {{ quiz.title }}
            </h1>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="text-align: right;">
                <span id="question-timer" style="font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--primary);">
                    30s
                </span>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Time Left</div>
            </div>
            <div style="text-align: right; border-left: 1px solid var(--border); padding-left: 1rem;">
                <span id="current-score" style="font-size: 1.1rem; font-weight: 700; color: var(--text-main);">
                    0
                </span>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Points</div>
            </div>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
    </div>

    <!-- Question Card -->
    <div id="question-card" class="card" style="min-height: 340px; padding: 2rem;">
        <div id="question-content">
            <div style="text-align: center; padding: 3rem 0; color: var(--text-muted);">
                <div class="spinner" style="margin-bottom: 0.5rem;"></div>
                <p>Loading question...</p>
            </div>
        </div>
    </div>

    <!-- Quiz Footer Controls -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
        <span id="question-counter" style="color: var(--text-muted); font-size: 0.9rem; font-weight: 500;">
            Question 1 of {{ questions|length }}
        </span>
        <div style="display: flex; gap: 0.5rem;">
            <button id="prev-btn" class="btn btn-secondary" onclick="previousQuestion()" style="display: none;">
                ← Prev
            </button>
            <button id="next-btn" class="btn btn-primary" onclick="nextQuestion();" disabled>
                Next →
            </button>
            <button id="finish-btn" class="btn btn-success" onclick="finishQuiz()" style="display: none;">
                ✓ Finish Quiz
            </button>
        </div>
    </div>

</div>

<script>
let currentQuestion = 0;
let totalQuestions = {{ questions|length }};
let score = 0;
let selectedAnswer = null;
let questionTimeLeft = 30;
let questionTimerInterval = null;

document.addEventListener('DOMContentLoaded', function() {
    loadQuestion(0);
});

function startQuestionTimer() {
    if (questionTimerInterval) clearInterval(questionTimerInterval);
    questionTimeLeft = 30;
    updateQuestionTimerDisplay();
    
    questionTimerInterval = setInterval(() => {
        questionTimeLeft--;
        updateQuestionTimerDisplay();
        
        if (questionTimeLeft <= 0) {
            clearInterval(questionTimerInterval);
            if (!selectedAnswer) {
                QuizMaster.showNotification('Time up for this question', 'warning');
                setTimeout(() => nextQuestion(), 800);
            }
        }
    }, 1000);
}

function updateQuestionTimerDisplay() {
    const timerElement = document.getElementById('question-timer');
    if (!timerElement) return;
    timerElement.textContent = `${questionTimeLeft}s`;
    if (questionTimeLeft <= 5) {
        timerElement.style.color = 'var(--danger)';
    } else if (questionTimeLeft <= 10) {
        timerElement.style.color = 'var(--warning)';
    } else {
        timerElement.style.color = 'var(--primary)';
    }
}

async function loadQuestion(questionNum) {
    try {
        const response = await fetch(`/quiz/question/${questionNum}`);
        if (!response.ok) throw new Error('HTTP error ' + response.status);
        const data = await response.json();
        
        if (data.error) {
            QuizMaster.showNotification(data.error, 'error');
            return;
        }
        
        displayQuestion(data);
        updateProgress(data.progress);
        updateQuestionCounter(data.question_num, data.total_questions);
        startQuestionTimer();
        selectedAnswer = null;
    } catch (error) {
        QuizMaster.showNotification('Failed to load question', 'error');
    }
}

function displayQuestion(data) {
    const question = data.question;
    const options = [question.option_a, question.option_b, question.option_c, question.option_d];
    
    const questionHTML = `
        <div class="question-text">
            ${data.question_num}. ${question.question_text}
        </div>
        <div class="options">
            ${options.map((option, index) => `
                <button class="option-btn" type="button" onclick="selectAnswer('${option.replace(/'/g, "\\'")}', this)">
                    <span class="option-badge">${String.fromCharCode(65 + index)}</span>
                    <span style="flex: 1;">${option}</span>
                </button>
            `).join('')}
        </div>
        <div id="explanation" class="explanation">
            <strong>Explanation:</strong>
            <p id="explanation-text" style="margin-top: 0.25rem;"></p>
        </div>
    `;
    
    document.getElementById('question-content').innerHTML = questionHTML;
    
    selectedAnswer = null;
    const nextBtn = document.getElementById('next-btn');
    nextBtn.disabled = true;
    nextBtn.innerHTML = 'Next →';
    nextBtn.style.display = 'block';
    
    const explanation = document.getElementById('explanation');
    if (explanation) explanation.classList.remove('show');
}

function selectAnswer(answer, button) {
    document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
    button.classList.add('selected');
    selectedAnswer = answer;
    document.getElementById('next-btn').disabled = false;
}

async function nextQuestion() {
    clearInterval(questionTimerInterval);
    if (!selectedAnswer) selectedAnswer = '';
    
    const nextBtn = document.getElementById('next-btn');
    nextBtn.disabled = true;
    nextBtn.innerHTML = '<span class="spinner"></span>';
    
    try {
        const response = await fetch('/quiz/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                answer: selectedAnswer,
                question_num: currentQuestion
            })
        });
        
        if (!response.ok) throw new Error('HTTP error ' + response.status);
        const result = await response.json();
        
        if (result.error) {
            QuizMaster.showNotification(result.error, 'error');
            nextBtn.innerHTML = 'Next →';
            nextBtn.disabled = false;
            return;
        }
        
        showAnswerResult(result);
        score = result.score;
        document.getElementById('current-score').textContent = score;
        
        setTimeout(() => {
            currentQuestion++;
            if (currentQuestion >= totalQuestions) {
                finishQuiz();
            } else {
                selectedAnswer = null;
                loadQuestion(currentQuestion);
                updateNavigationButtons();
            }
        }, 850);
        
    } catch (error) {
        QuizMaster.showNotification('Error saving answer', 'error');
        nextBtn.innerHTML = 'Next →';
        nextBtn.disabled = false;
    }
}

function showAnswerResult(result) {
    const options = document.querySelectorAll('.option-btn');
    options.forEach(btn => {
        btn.disabled = true;
        const btnText = btn.querySelector('span:last-child').textContent.trim();
        if (btnText === result.correct_answer) {
            btn.classList.add('correct');
            btn.querySelector('.option-badge').innerHTML = '✓';
        } else if (btn.classList.contains('selected') && !result.correct) {
            btn.classList.add('incorrect');
            btn.querySelector('.option-badge').innerHTML = '✕';
        }
    });
    
    if (result.explanation) {
        document.getElementById('explanation-text').textContent = result.explanation;
        document.getElementById('explanation').classList.add('show');
    }
    
    if (result.correct) {
        QuizMaster.playSuccessSound();
    } else {
        QuizMaster.playErrorSound();
    }
}

function previousQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion(currentQuestion);
        updateNavigationButtons();
    }
}

function updateProgress(progress) {
    document.getElementById('progress-bar').style.width = progress + '%';
}

function updateQuestionCounter(current, total) {
    document.getElementById('question-counter').textContent = `Question ${current} of ${total}`;
}

function updateNavigationButtons() {
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const finishBtn = document.getElementById('finish-btn');
    
    prevBtn.style.display = currentQuestion > 0 ? 'inline-flex' : 'none';
    if (currentQuestion === totalQuestions - 1) {
        nextBtn.style.display = 'none';
        finishBtn.style.display = 'inline-flex';
    } else {
        nextBtn.style.display = 'inline-flex';
        finishBtn.style.display = 'none';
    }
}

function finishQuiz() {
    if (questionTimerInterval) clearInterval(questionTimerInterval);
    QuizMaster.playAchievementSound();
    window.location.href = '/quiz/results';
}

// Keyboard shortcuts (1-4 for options, Enter for next)
document.addEventListener('keydown', function(e) {
    if (e.key >= '1' && e.key <= '4') {
        const optionIndex = parseInt(e.key, 10) - 1;
        const options = document.querySelectorAll('.option-btn');
        if (options[optionIndex] && !options[optionIndex].disabled) {
            options[optionIndex].click();
        }
    } else if (e.key === 'Enter' && selectedAnswer) {
        if (currentQuestion === totalQuestions - 1) {
            finishQuiz();
        } else {
            nextQuestion();
        }
    }
});
</script>
{% endblock %}
