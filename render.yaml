databases:
  - name: quizmaster-db
    plan: free
    databaseName: quizmaster
    user: quizmaster

services:
  - type: web
    name: quizmaster-pro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 2 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: quizmaster-db
          property: connectionString